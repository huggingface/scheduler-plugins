kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "scheduler-plugins.controllerName" . }}
  namespace: {{ include "scheduler-plugins.namespace" . }}
  labels:
    app: {{ include "scheduler-plugins.controllerName" . }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "scheduler-plugins.controllerName" . }}
  template:
    metadata:
      labels:
        app: {{ include "scheduler-plugins.controllerName" . }}
    spec:
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "scheduler-plugins.controllerName" . }}
      containers:
      - name: scheduler-plugins-controller
        args:
        {{- if .Values.controller.leaderElect }}
        - --enableLeaderElection
        {{- end }}
        image: {{ .Values.controller.image }}
        imagePullPolicy: IfNotPresent
        {{- with .Values.controller.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    component: scheduler
  name: {{ include "scheduler-plugins.schedulerName" . }}
  namespace: {{ include "scheduler-plugins.namespace" . }}
spec:
  selector:
    matchLabels:
      component: {{ include "scheduler-plugins.schedulerName" . }}
  replicas: {{ .Values.scheduler.replicaCount }}
  template:
    metadata:
      labels:
        component: {{ include "scheduler-plugins.schedulerName" . }}
    spec:
      {{- with .Values.scheduler.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "scheduler-plugins.schedulerName" . }}
      containers:
      - command: {{- toYaml .Values.scheduler.command | nindent 8 }}
        args:
        - --config=/etc/kubernetes/scheduler-config.yaml
        image: {{ .Values.scheduler.image }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
          initialDelaySeconds: 15
        name: scheduler-plugins-scheduler
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
        {{- with .Values.scheduler.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          privileged: false
        volumeMounts:
        - name: scheduler-config
          mountPath: /etc/kubernetes
          readOnly: true
      hostNetwork: false
      hostPID: false
      volumes:
      - name: scheduler-config
        configMap:
          name: {{ include "scheduler-plugins.schedulerName" . }}-config
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
